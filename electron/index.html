<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鲸鱼娘桌宠</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <div id="speech-bubble" class="bubble hidden">
      <div id="speech-text"></div>
    </div>
    <div id="pet-wrapper" class="wrapper">
      <img id="pet-img" src="./assets/maid-whale-idle.jpg" alt="鲸鱼娘" draggable="false">
      <!-- 举手提醒图标：审批/提问时从右侧弹出 -->
      <div id="raise-hand" class="raise-hand hidden">✋</div>
    </div>
    <div id="status-badge" class="badge">
      <span class="dot"></span>
      <span id="status-label">待机中</span>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
